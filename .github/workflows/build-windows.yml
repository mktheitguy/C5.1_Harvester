# Builds a standalone Windows version of the C5.1 COUNTER Harvester
# on GitHub's free Windows machines. No Windows PC needed.
#
# How to run it: Actions tab > "Build Windows app" > "Run workflow".
# When it finishes, download "COUNTER_Harvester_Windows" from the
# Artifacts section at the bottom of the run page.

name: Build Windows app

on:
  workflow_dispatch:        # the "Run workflow" button
  push:
    branches: [main]        # rebuild after every change (or "Sync fork")
  release:
    types: [published]      # also attach the zip to a GitHub Release

permissions:
  contents: write           # only needed to attach the zip to a Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install "python-dateutil==2.9.0.post0" "requests==2.32.3" "PyQt6>=6.7.0" "brotli==1.1.0" pyinstaller
          python -c "import brotli, dateutil, requests, PyQt6.QtWidgets; print('All packages OK')"

      - name: Build COUNTER_Harvester.exe
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name COUNTER_Harvester
          --paths src
          --add-data "src/current_config.py;seed"
          --add-data "src/default_config.py;seed"
          packaging/harvester_launcher.py

      - name: Test that the app starts and stays open
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "harvester_test_data"
          $env:COUNTER_HARVESTER_DATA = $data
          $p = Start-Process -FilePath "dist\COUNTER_Harvester\COUNTER_Harvester.exe" -PassThru
          Start-Sleep -Seconds 20
          $errorFile = Join-Path $data "startup_error.txt"
          if (Test-Path $errorFile) {
            Write-Host "The app reported a startup error:"
            Get-Content $errorFile
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            exit 1
          }
          if ($p.HasExited) {
            Write-Host "The app closed by itself (exit code $($p.ExitCode))."
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          if (-not (Test-Path (Join-Path $data "current_config.py"))) {
            Write-Host "The data folder was not set up."
            exit 1
          }
          Write-Host "Smoke test passed: the app started on Windows and set up its data folder."

      - name: Add the read-me file
        shell: pwsh
        run: Copy-Item packaging\README_FIRST.txt dist\COUNTER_Harvester\

      - name: Upload the app (download it from the run page)
        uses: actions/upload-artifact@v7
        with:
          name: COUNTER_Harvester_Windows
          path: dist/
          retention-days: 90

      - name: Attach the zip to the Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist\COUNTER_Harvester -DestinationPath COUNTER_Harvester_Windows.zip -Force
          gh release upload "${{ github.event.release.tag_name }}" COUNTER_Harvester_Windows.zip --clobber
